<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adhiparasakthi Engineering College — Sign In</title>
<style>
  :root{
    --maroon:#8E1B1B;
    --maroon-deep:#5E1010;
    --red:#C42B2B;
    --gold:#C9A227;
    --paper:#FBF6EC;
    --ink:#3A2323;
    --slate:#7A6A5D;
    --radius:16px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(201,162,39,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(142,27,27,0.08), transparent 50%),
      var(--paper);
    color:var(--ink);
  }

  .screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .card{
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:var(--radius);
    padding:40px 36px 34px;
    box-shadow:0 25px 50px -20px rgba(94,16,16,0.28);
    border:1px solid rgba(201,162,39,0.25);
    text-align:center;
  }

  .logo-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }

  .logo-wrap img{
    width:96px;
    height:96px;
    object-fit:contain;
    border-radius:50%;
    box-shadow:0 0 0 3px #fff, 0 0 0 4.5px var(--gold);
  }

  .college-name{
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.3px;
    color:var(--maroon-deep);
    margin:2px 0 2px;
    line-height:1.35;
  }

  .college-loc{
    font-size:11.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:6px;
  }

  .motto{
    font-size:10.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--red);
    font-weight:700;
    margin-bottom:22px;
  }

  .divider-line{
    width:52px;
    height:3px;
    background:linear-gradient(90deg, var(--gold), var(--red));
    border-radius:2px;
    margin:0 auto 22px;
  }

  .form-side h1{
    font-size:19px;
    margin:0 0 4px;
    color:var(--maroon-deep);
    text-align:left;
  }

  .form-side p.lead{
    margin:0 0 22px;
    font-size:13px;
    color:var(--slate);
    text-align:left;
  }

  .field{
    margin-bottom:16px;
    text-align:left;
  }

  .field label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.4px;
    color:var(--maroon-deep);
    margin-bottom:6px;
    text-transform:uppercase;
  }

  .field input{
    width:100%;
    padding:11px 13px;
    font-size:14px;
    border:1.5px solid #E7DCC8;
    border-radius:8px;
    background:#FFFDF9;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }

  .field input::placeholder{color:#B9AC9A;}

  .field input:focus{
    border-color:var(--maroon);
    box-shadow:0 0 0 3px rgba(142,27,27,0.13);
  }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12.5px;
    margin:2px 0 22px;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--slate);
  }

  .remember input{width:14px;height:14px;accent-color:var(--maroon);}

  .row a{
    color:var(--maroon);
    text-decoration:none;
    font-weight:600;
  }
  .row a:hover{text-decoration:underline;}

  button.submit{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:linear-gradient(90deg, var(--maroon) 0%, var(--red) 100%);
    color:#fff;
    font-size:14px;
    font-weight:700;
    letter-spacing:.4px;
    cursor:pointer;
    transition:filter .15s ease, transform .05s ease;
  }

  button.submit:hover{filter:brightness(1.06);}
  button.submit:active{transform:translateY(1px);}

  button.submit:focus-visible,
  .field input:focus-visible,
  .row a:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  .footer-note{
    font-size:12px;
    color:var(--slate);
    text-align:center;
    margin-top:20px;
  }
  .footer-note a{color:var(--maroon);font-weight:600;text-decoration:none;}
  .footer-note a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="screen">
  <div class="card">

    <div class="logo-wrap">
      <img src="logo.jpg" alt="Adhiparasakthi Engineering College logo">
    </div>
    <div class="college-name">Adhiparasakthi<br>Engineering College</div>
    <div class="college-loc">Melmaruvathur</div>
    <div class="motto">Study &nbsp;·&nbsp; Spirituality &nbsp;·&nbsp; Service</div>
    <div class="divider-line"></div>

    <div class="form-side">
      <h1>Sign in to your account</h1>
      <p class="lead">Enter your credentials to continue.</p>

      <form action="#" method="post" novalidate>
        <div class="field">
          <label for="email">Register No. / Email</label>
          <input id="email" name="email" type="text" placeholder="Enter register number or email" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" name="remember">
            Keep me signed in
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="submit">Sign in</button>
      </form>

      <p class="footer-note">
        Need help? <a href="#">Contact administration</a>
      </p>
    </div>

  </div>
</div>

</body>
</html>
